name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python -m py_compile src/remote-script/LiveBridgeBrowser/__init__.py
      - run: python -m unittest discover -s test -p "test_*.py"
